name: mect-staging

services:
  mect-postgres-staging:
    image: postgres:18-alpine
    container_name: mect-postgres-staging
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mect_staging_db}
      POSTGRES_USER: ${DB_USERNAME:-mect_staging_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - mect-staging-pgdata:/var/lib/postgresql/data
    networks:
      - mect-staging-network
    # Zero published ports on host; internal Docker network access only
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-mect_staging_user} -d $${POSTGRES_DB:-mect_staging_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mect-backend-staging:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: mect-backend:staging
    container_name: mect-backend-staging
    restart: unless-stopped
    depends_on:
      mect-postgres-staging:
        condition: service_healthy
    ports:
      # Bound strictly to loopback 127.0.0.1:8082 for host Nginx reverse proxy
      - "127.0.0.1:8082:8080"
    environment:
      SPRING_PROFILES_ACTIVE: "staging"
      SERVER_PORT: "8080"
      DB_HOST: "mect-postgres-staging"
      DB_PORT: "5432"
      DB_NAME: "${DB_NAME:-mect_staging_db}"
      DB_USERNAME: "${DB_USERNAME:-mect_staging_user}"
      DB_PASSWORD: "${DB_PASSWORD}"
      CORS_ALLOWED_ORIGINS: "https://staging.mect.org.in,https://staging-api.mect.org.in"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_ACCESS_VALIDITY: "900"
      JWT_REFRESH_VALIDITY: "604800"
      OTP_HASH_PEPPER: "${OTP_HASH_PEPPER}"
      OTP_DETERMINISTIC_TEST_ENABLED: "true"
      APP_PUBLIC_BASE_URL: "https://staging.mect.org.in"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      RESEND_API_KEY: "${RESEND_API_KEY:-MOCK}"
      RESEND_FROM_NOTIFICATIONS: "MECT Staging Notifications <notifications@mect.org.in>"
      RESEND_FROM_DONATIONS: "MECT Staging Donations <donations@mect.org.in>"
      SMS_PROVIDER: "MOCK"
      PAYMENT_PROVIDER: "CASHFREE"
      PAYMENT_SANDBOX_MODE: "true"
      CASHFREE_ENV: "SANDBOX"
      WHATSAPP_ENABLED: "false"
      JAVA_OPTS: "-Xms128m -Xmx384m -XX:+UseG1GC"
    volumes:
      - mect-staging-media:/app/uploads/media
      - mect-staging-receipts:/app/receipts
    networks:
      - mect-staging-network
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 768M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/api/v1/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

  mect-frontend-staging:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "https://staging.mect.org.in/api/v1"
        NEXT_PUBLIC_API_URL: "https://staging.mect.org.in/api/v1"
        ENABLE_DONOR_PORTAL: "true"
        NEXT_PUBLIC_ENABLE_DONOR_PORTAL: "true"
    image: mect-frontend:staging
    container_name: mect-frontend-staging
    restart: unless-stopped
    depends_on:
      mect-backend-staging:
        condition: service_healthy
    ports:
      # Bound strictly to loopback 127.0.0.1:3002 for host Nginx reverse proxy
      - "127.0.0.1:3002:3000"
    environment:
      NODE_ENV: "production"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_BASE_URL: "https://staging.mect.org.in/api/v1"
      NEXT_PUBLIC_API_URL: "https://staging.mect.org.in/api/v1"
      ENABLE_DONOR_PORTAL: "true"
      NEXT_PUBLIC_ENABLE_DONOR_PORTAL: "true"
      BACKEND_API_URL: "http://mect-backend-staging:8080"
      AI_ENGINE_MODE: "local_with_fallback"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GROQ_MODEL: "qwen/qwen3.8-27b"
    networks:
      - mect-staging-network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/ai/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  mect-staging-network:
    name: mect-staging-network
    driver: bridge

volumes:
  mect-staging-pgdata:
    name: mect-staging-pgdata
  mect-staging-media:
    name: mect-staging-media
  mect-staging-receipts:
    name: mect-staging-receipts

name: mect

services:
  mect-postgres:
    image: postgres:18-alpine
    container_name: mect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mect_db}
      POSTGRES_USER: ${DB_USERNAME:-mect_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - mect-pgdata:/var/lib/postgresql/data
    networks:
      - mect-network
    ports:
      # Bound strictly to loopback on non-default port to avoid host conflict with system postgres
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-mect_user} -d $${POSTGRES_DB:-mect_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mect-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: mect-backend:production
    container_name: mect-backend
    restart: unless-stopped
    depends_on:
      mect-postgres:
        condition: service_healthy
    ports:
      # Bound strictly to loopback 127.0.0.1:8081 for host Nginx reverse proxy
      - "127.0.0.1:8081:8080"
    environment:
      SERVER_PORT: "8080"
      DB_HOST: "mect-postgres"
      DB_PORT: "5432"
      DB_NAME: "${DB_NAME:-mect_db}"
      DB_USERNAME: "${DB_USERNAME:-mect_user}"
      DB_PASSWORD: "${DB_PASSWORD}"
      CORS_ALLOWED_ORIGINS: "https://mect.org.in,https://www.mect.org.in"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_ACCESS_VALIDITY: "${JWT_ACCESS_VALIDITY:-900}"
      JWT_REFRESH_VALIDITY: "${JWT_REFRESH_VALIDITY:-604800}"
      OTP_HASH_PEPPER: "${OTP_HASH_PEPPER}"
      RESEND_API_KEY: "${RESEND_API_KEY}"
      RESEND_FROM_NOTIFICATIONS: "${RESEND_FROM_NOTIFICATIONS:-MECT Notifications <notifications@mect.org.in>}"
      RESEND_FROM_DONATIONS: "${RESEND_FROM_DONATIONS:-MECT Donations <donations@mect.org.in>}"
      APP_PUBLIC_BASE_URL: "https://mect.org.in"
      PAYMENT_PROVIDER: "${PAYMENT_PROVIDER:-CASHFREE}"
      PAYMENT_SANDBOX_MODE: "${PAYMENT_SANDBOX_MODE:-false}"
      CASHFREE_ENV: "${CASHFREE_ENV:-PRODUCTION}"
      CASHFREE_API_VERSION: "${CASHFREE_API_VERSION:-2023-08-01}"
      CASHFREE_APP_ID: "${CASHFREE_APP_ID}"
      CASHFREE_SECRET_KEY: "${CASHFREE_SECRET_KEY}"
      CASHFREE_WEBHOOK_SECRET: "${CASHFREE_WEBHOOK_SECRET}"
      CASHFREE_WEBHOOK_TOLERANCE_SECONDS: "${CASHFREE_WEBHOOK_TOLERANCE_SECONDS:-300}"
      CASHFREE_RETURN_URL: "https://mect.org.in/donate?order_id={order_id}"
      CASHFREE_NOTIFY_URL: "https://mect.org.in/api/v1/webhooks/payments/cashfree"
    volumes:
      - mect-media:/app/uploads/media
      - mect-receipts:/app/receipts
    networks:
      - mect-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/api/v1/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

  mect-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "https://mect.org.in"
        NEXT_PUBLIC_API_URL: "https://mect.org.in/api/v1"
    image: mect-frontend:production
    container_name: mect-frontend
    restart: unless-stopped
    depends_on:
      mect-backend:
        condition: service_healthy
    ports:
      # Bound strictly to loopback 127.0.0.1:3001 for host Nginx reverse proxy
      - "127.0.0.1:3001:3000"
    environment:
      NODE_ENV: "production"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_BASE_URL: "https://mect.org.in"
      NEXT_PUBLIC_API_URL: "https://mect.org.in/api/v1"
      AI_ENGINE_MODE: "${AI_ENGINE_MODE:-local_with_fallback}"
      GROQ_API_KEY: "${GROQ_API_KEY}"
      GROQ_MODEL: "${GROQ_MODEL:-qwen/qwen3.8-27b}"
    networks:
      - mect-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/ai/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  mect-network:
    name: mect-network
    driver: bridge

volumes:
  mect-pgdata:
    name: mect-pgdata
  mect-media:
    name: mect-media
  mect-receipts:
    name: mect-receipts

# ==============================================================================
# MECT (Mahaveer Educational & Charitable Trust) — Staging Virtual Hosts
# Domains: staging.mect.org.in, staging-api.mect.org.in
# TLS: Cloudflare Origin CA (Full Strict Compatible with wildcard *.mect.org.in)
# Reverse Proxy to MECT Staging Docker Containers:
#   - Staging Frontend (Next.js): 127.0.0.1:3002
#   - Staging Backend (Spring Boot): 127.0.0.1:8082
# Strict Isolation: Production (3001, 8081, 5433) and OHO Tech (3000, 8080, 5432)
# ==============================================================================

# HTTP -> HTTPS Redirect for Staging Subdomains
server {
    listen 80;
    listen [::]:80;
    server_name staging.mect.org.in staging-api.mect.org.in;

    location /.well-known/acme-challenge/ {
        root /var/www/mect;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Host: staging.mect.org.in (Frontend)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name staging.mect.org.in;

    # Cloudflare Origin CA Wildcard SSL Certificates
    ssl_certificate /etc/ssl/mect/fullchain.pem;
    ssl_certificate_key /etc/ssl/mect/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:MECT_STAGING_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Institutional Security Headers & Staging Disallow Indexing
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https://staging-api.mect.org.in https://accounts.google.com; script-src 'self' 'unsafe-inline' https://accounts.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://staging-api.mect.org.in https://accounts.google.com; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self';" always;

    # Staging Logs
    access_log /var/log/nginx/mect.staging.access.log;
    error_log /var/log/nginx/mect.staging.error.log;

    # Next.js Staging Frontend Upstream (Port 3002)
    # Optional HTTP Basic Auth Fallback (Uncomment if Cloudflare Access is not yet configured)
    # auth_basic "Restricted MECT Staging Environment";
    # auth_basic_user_file /etc/nginx/.htpasswd_staging;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120;
        proxy_connect_timeout 60;
    }
}

# HTTPS Host: staging-api.mect.org.in (Backend API)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name staging-api.mect.org.in;

    # Cloudflare Origin CA Wildcard SSL Certificates
    ssl_certificate /etc/ssl/mect/fullchain.pem;
    ssl_certificate_key /etc/ssl/mect/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:MECT_STAGING_API_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Institutional Security Headers
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Staging API Logs
    access_log /var/log/nginx/mect.staging.api.access.log;
    error_log /var/log/nginx/mect.staging.api.error.log;

    # Spring Boot Staging Backend API Upstream (Port 8082)
    # Optional HTTP Basic Auth Fallback (Only use if Cloudflare Access is unavailable)
    # Note: Cloudflare Access is strongly preferred to avoid Authorization header collisions with JWT Bearer tokens
    # auth_basic "Restricted MECT Staging API";
    # auth_basic_user_file /etc/nginx/.htpasswd_staging;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
        proxy_connect_timeout 90;
    }

    # Staging Actuator Health Check (Permitted for container/proxy monitoring)
    location = /api/v1/actuator/health {
        # auth_basic off;
        proxy_pass http://127.0.0.1:8082/api/v1/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Block sensitive actuator endpoints from public probing
    location /api/v1/actuator {
        deny all;
        return 404;
    }
}

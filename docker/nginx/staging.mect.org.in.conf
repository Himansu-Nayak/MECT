# ==============================================================================
# MECT (Mahaveer Educational & Charitable Trust) — Staging Virtual Hosts
# Domains: staging.mect.org.in, staging-api.mect.org.in
# TLS: Cloudflare Origin CA (Full Strict Compatible with wildcard *.mect.org.in)
# Reverse Proxy to MECT Staging Docker Containers:
#   - Staging Frontend (Next.js): 127.0.0.1:3002
#   - Staging Backend (Spring Boot): 127.0.0.1:8082
# Strict Isolation: Production (3001, 8081, 5433) and OHO Tech (3000, 8080, 5432)
# ==============================================================================

# HTTP -> HTTPS Redirect for Staging Subdomains
server {
    listen 80;
    listen [::]:80;
    server_name staging.mect.org.in staging-api.mect.org.in;

    location /.well-known/acme-challenge/ {
        root /var/www/mect;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Host: staging.mect.org.in (Frontend & Same-Origin API)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name staging.mect.org.in;

    # Cloudflare Origin CA Wildcard SSL Certificates
    ssl_certificate /etc/ssl/mect/fullchain.pem;
    ssl_certificate_key /etc/ssl/mect/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:MECT_STAGING_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Cloudflare Origin Security: Accept traffic only from official Cloudflare Edge IPs & VPS loopback
    allow 173.245.48.0/20;
    allow 103.21.244.0/22;
    allow 103.22.200.0/22;
    allow 103.31.4.0/22;
    allow 141.101.64.0/18;
    allow 108.162.192.0/18;
    allow 190.93.240.0/20;
    allow 188.114.96.0/20;
    allow 197.234.240.0/22;
    allow 198.41.128.0/17;
    allow 162.158.0.0/15;
    allow 104.16.0.0/13;
    allow 104.24.0.0/14;
    allow 172.64.0.0/13;
    allow 131.0.72.0/22;
    allow 2400:cb00::/32;
    allow 2606:4700::/32;
    allow 2803:f800::/32;
    allow 2405:b500::/32;
    allow 2405:8100::/32;
    allow 2a06:98c0::/29;
    allow 2c0f:f248::/32;
    allow 127.0.0.1;
    allow ::1;
    deny all;

    # Institutional Security Headers & Staging Disallow Indexing
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https://staging.mect.org.in https://staging-api.mect.org.in https://accounts.google.com; script-src 'self' 'unsafe-inline' https://accounts.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://staging.mect.org.in https://staging-api.mect.org.in https://accounts.google.com; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self';" always;

    # Staging Logs
    access_log /var/log/nginx/mect.staging.access.log;
    error_log /var/log/nginx/mect.staging.error.log;

    client_max_body_size 25M;

    # Actuator Health Check (Permitted for container/proxy monitoring)
    location = /api/v1/actuator/health {
        proxy_pass http://127.0.0.1:8082/api/v1/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Block sensitive actuator endpoints from public probing
    location /api/v1/actuator {
        deny all;
        return 404;
    }

    # Spring Boot Staging Backend API Upstream (Port 8082) - Scoped to /api/v1/
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
        proxy_connect_timeout 90;
    }

    # Next.js Server-Side Route Handlers (/api/contact, /api/donations/claim, /api/ai/)
    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
        proxy_connect_timeout 90;
    }

    # Next.js Staging Frontend Upstream (Port 3002)
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120;
        proxy_connect_timeout 60;
    }
}

# HTTPS Host: staging-api.mect.org.in (Dedicated Backend API Hostname)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name staging-api.mect.org.in;

    # Cloudflare Origin CA Wildcard SSL Certificates
    ssl_certificate /etc/ssl/mect/fullchain.pem;
    ssl_certificate_key /etc/ssl/mect/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:MECT_STAGING_API_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Cloudflare Origin Security: Accept traffic only from official Cloudflare Edge IPs & VPS loopback
    allow 173.245.48.0/20;
    allow 103.21.244.0/22;
    allow 103.22.200.0/22;
    allow 103.31.4.0/22;
    allow 141.101.64.0/18;
    allow 108.162.192.0/18;
    allow 190.93.240.0/20;
    allow 188.114.96.0/20;
    allow 197.234.240.0/22;
    allow 198.41.128.0/17;
    allow 162.158.0.0/15;
    allow 104.16.0.0/13;
    allow 104.24.0.0/14;
    allow 172.64.0.0/13;
    allow 131.0.72.0/22;
    allow 2400:cb00::/32;
    allow 2606:4700::/32;
    allow 2803:f800::/32;
    allow 2405:b500::/32;
    allow 2405:8100::/32;
    allow 2a06:98c0::/29;
    allow 2c0f:f248::/32;
    allow 127.0.0.1;
    allow ::1;
    deny all;

    # Institutional Security Headers
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Staging API Logs
    access_log /var/log/nginx/mect.staging.api.access.log;
    error_log /var/log/nginx/mect.staging.api.error.log;

    client_max_body_size 25M;

    # Staging Actuator Health Check (Permitted for container/proxy monitoring)
    location = /api/v1/actuator/health {
        proxy_pass http://127.0.0.1:8082/api/v1/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Block sensitive actuator endpoints from public probing
    location /api/v1/actuator {
        deny all;
        return 404;
    }

    # Spring Boot Staging Backend API Upstream (Port 8082)
    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
        proxy_connect_timeout 90;
    }
}

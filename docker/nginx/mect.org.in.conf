# ==============================================================================
# MECT (Mahaveer Educational & Charitable Trust) — Production Virtual Host
# Domains: mect.org.in, www.mect.org.in
# TLS: Cloudflare Origin CA (Full Strict Compatible)
# Preserves: ohotech.com (Port 3000, Port 8080)
# Reverse Proxy to MECT Docker Containers:
#   - Frontend (Next.js): 127.0.0.1:3001
#   - Backend (Spring Boot): 127.0.0.1:8081
# ==============================================================================

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name mect.org.in www.mect.org.in;

    # ACME challenge location if needed
    location /.well-known/acme-challenge/ {
        root /var/www/mect;
        allow all;
    }

    location / {
        return 301 https://mect.org.in$request_uri;
    }
}

# HTTPS Canonical Redirect: www.mect.org.in -> mect.org.in
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.mect.org.in;

    ssl_certificate /etc/ssl/mect/fullchain.pem;
    ssl_certificate_key /etc/ssl/mect/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    return 301 https://mect.org.in$request_uri;
}

# HTTPS Primary Host: mect.org.in
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mect.org.in;

    # Cloudflare Origin CA SSL Certificates
    ssl_certificate /etc/ssl/mect/fullchain.pem;
    ssl_certificate_key /etc/ssl/mect/origin.key;

    # Modern TLS Security Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:MECT_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Institutional Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logs
    access_log /var/log/nginx/mect.access.log;
    error_log /var/log/nginx/mect.error.log;

    root /var/www/mect;
    index index.html;

    # Next.js AI Gateway API Upstream (Port 3001)
    location /api/ai/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
        proxy_connect_timeout 60;
    }

    # Spring Boot Backend API Upstream (Port 8081)
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
        proxy_connect_timeout 90;
    }

    # Actuator Health Public Restriction (Internal only or explicit health check)
    location = /api/v1/actuator/health {
        proxy_pass http://127.0.0.1:8081/api/v1/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Next.js Frontend Application Upstream (Port 3001)
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        error_page 502 503 504 = @holding;
    }

    # Fallback Holding/Maintenance Route if Upstream is Initializing
    location @holding {
        root /var/www/mect;
        try_files /index.html =503;
    }
}
